	<script>
		// Nav: solid background + mobile toggle
		const nav2 = document.getElementById('nav2');
		window.addEventListener('scroll', function () {
			nav2.classList.toggle('scrolled', window.scrollY > 40);
		}, { passive: true });
		nav2.classList.toggle('scrolled', window.scrollY > 40);

		const nav2Toggle = document.getElementById('nav2Toggle');
		const nav2Links = document.getElementById('nav2Links');
		nav2Toggle.addEventListener('click', function () {
			const isOpen = nav2Links.classList.toggle('open');
			nav2Toggle.classList.toggle('is-active', isOpen);
			nav2Toggle.setAttribute('aria-expanded', isOpen);
		});
		nav2Links.querySelectorAll('a').forEach(function (link) {
			link.addEventListener('click', function () {
				nav2Links.classList.remove('open');
				nav2Toggle.classList.remove('is-active');
				nav2Toggle.setAttribute('aria-expanded', false);
			});
		});

		// Gallery pagination: reveal photos in batches instead of all 156 at once
		(function () {
			const BATCH_SIZE = 24;
			const items = Array.from(document.querySelectorAll('.gallery2-grid .g2-item'));
			const loadMoreBtn = document.getElementById('galleryLoadMore');
			let shown = BATCH_SIZE;

			items.forEach(function (item, index) {
				if (index >= BATCH_SIZE) item.classList.add('g2-hidden');
			});
			if (items.length <= BATCH_SIZE) loadMoreBtn.style.display = 'none';

			loadMoreBtn.addEventListener('click', function () {
				items.slice(shown, shown + BATCH_SIZE).forEach(function (item) {
					item.classList.remove('g2-hidden');
				});
				shown += BATCH_SIZE;
				if (shown >= items.length) loadMoreBtn.style.display = 'none';
			});
		})();

		// Gallery lightbox with prev/next navigation
		document.addEventListener('DOMContentLoaded', function () {
			const images = Array.from(document.querySelectorAll('.img-gallery'));
			const previewOverlay = document.getElementById('previewOverlay');
			const previewImg = document.getElementById('previewImg');
			const closePreview = document.getElementById('closePreview');
			const previewPrev = document.getElementById('previewPrev');
			const previewNext = document.getElementById('previewNext');
			let currentIndex = 0;

			function showImage(index) {
				currentIndex = (index + images.length) % images.length;
				const image = images[currentIndex];
				previewImg.src = image.src;
				previewImg.alt = image.alt;
			}

			images.forEach(function (image, index) {
				image.addEventListener('click', function () {
					showImage(index);
					previewOverlay.classList.add('active');
				});
			});

			previewPrev.addEventListener('click', function (e) {
				e.stopPropagation();
				showImage(currentIndex - 1);
			});

			previewNext.addEventListener('click', function (e) {
				e.stopPropagation();
				showImage(currentIndex + 1);
			});

			closePreview.addEventListener('click', function () {
				previewOverlay.classList.remove('active');
			});

			previewOverlay.addEventListener('click', function (e) {
				if (e.target === previewOverlay) {
					previewOverlay.classList.remove('active');
				}
			});

			document.addEventListener('keydown', function (e) {
				if (!previewOverlay.classList.contains('active')) return;
				if (e.key === 'Escape') previewOverlay.classList.remove('active');
				if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
				if (e.key === 'ArrowRight') showImage(currentIndex + 1);
			});
		});

		// Reveal-on-scroll
		const revealItems = document.querySelectorAll('.reveal2');
		if ('IntersectionObserver' in window) {
			const io = new IntersectionObserver(function (entries) {
				entries.forEach(function (entry) {
					if (entry.isIntersecting) {
						entry.target.classList.add('is-visible');
						io.unobserve(entry.target);
					}
				});
			}, { threshold: 0.05 });
			revealItems.forEach(function (el) { io.observe(el); });
		} else {
			revealItems.forEach(function (el) { el.classList.add('is-visible'); });
		}
	</script>
